{{define "eventlog"}}
<div class="card">
  <h2>Event Log</h2>
  <p style="font-size:0.85em;color:#888;margin-bottom:1rem;">
    Live via WebSocket + pg_eventserv (channel: webui_events)
  </p>

  <div class="worker-stats" style="margin-bottom:1rem;padding:0.75rem;background:#f8f8f8;border-radius:6px;border:1px solid #e0e0e0;">
    <div style="font-size:0.8em;color:#888;font-weight:600;margin-bottom:0.5rem;">Worker Pool Status</div>
    <table style="width:100%;font-size:0.85em;border-collapse:collapse;">
      <tr>
        <td style="padding:2px 8px;color:#666;">Workers</td>
        <td style="padding:2px 8px;font-family:monospace;" id="stat-workers">4</td>
      </tr>
      <tr>
        <td style="padding:2px 8px;color:#666;">  └ JobWorker</td>
        <td style="padding:2px 8px;font-family:monospace;color:#0a0;">2</td>
      </tr>
      <tr>
        <td style="padding:2px 8px;color:#666;">  └ CandidateWorker</td>
        <td style="padding:2px 8px;font-family:monospace;color:#0a0;">2</td>
      </tr>
      <tr></tr>
      <tr>
        <td style="padding:2px 8px;color:#666;">Queue Depth</td>
        <td style="padding:2px 8px;font-family:monospace;" id="stat-queue">0</td>
      </tr>
      <tr>
        <td style="padding:2px 8px;color:#666;">Outbox Pending</td>
        <td style="padding:2px 8px;font-family:monospace;" id="stat-outbox">0</td>
      </tr>
      <tr>
        <td style="padding:2px 8px;color:#666;">Processed</td>
        <td style="padding:2px 8px;font-family:monospace;" id="stat-processed">0</td>
      </tr>
    </table>
  </div>

  <ul id="eventlog-list" class="list event-log">
    {{range .}}
    <li class="list-item event-item">
      <span class="type">{{.Type}}</span>
      <span class="id">{{.ID}}</span>
      <pre class="payload">{{.Payload}}</pre>
    </li>
    {{end}}
  </ul>
</div>

<script>
(function() {
  var list = document.getElementById('eventlog-list');
  var reconnectAttempts = 0;
  var maxReconnectAttempts = 30;

  function connect() {
    var ws = new WebSocket('ws://' + window.location.hostname + ':7700/listen/webui_events');

    ws.onopen = function() { console.log('pg_eventserv WebSocket connected'); reconnectAttempts = 0; };

    ws.onmessage = function(event) {
      var data;
      try { data = JSON.parse(event.data); } catch(e) { return; }

      var li = document.createElement('li');
      li.className = 'list-item event-item';
      li.innerHTML = '<span class="worker">' + (data.worker || '') + '</span>' +
                     '<span class="timestamp">' + (data.time || '') + '</span>' +
                     '<span class="type">' + data.type + '</span>' +
                     '<span class="id">' + data.id + '</span>' +
                     '<pre class="payload">' + (data.payload ? JSON.stringify(data.payload, null, 2) : '') + '</pre>';
      list.prepend(li);
    };

    ws.onclose = function() {
      console.log('pg_eventserv WebSocket disconnected');
      reconnectAttempts++;
      if (reconnectAttempts <= maxReconnectAttempts) {
        setTimeout(connect, Math.min(1000 * reconnectAttempts, 10000));
      }
    };

    ws.onerror = function(err) {
      console.log('WebSocket error:', err);
    };
  }

  connect();

  // Poll worker stats every 2 seconds
  function fetchStats() {
    fetch('/api/worker-stats')
      .then(function(r) { return r.json(); })
      .then(function(s) {
        document.getElementById('stat-workers').textContent = s.workers;
        document.getElementById('stat-queue').textContent = s.queue_depth;
        document.getElementById('stat-outbox').textContent = s.outbox_pending;
        document.getElementById('stat-processed').textContent = s.processed;
      })
      .catch(function(e) { console.log('stats fetch error:', e); });
  }

  fetchStats();
  setInterval(fetchStats, 2000);
})();
</script>
{{end}}
