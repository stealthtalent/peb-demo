{{define "eventlog"}}
<div class="card">
  <h2>Event Log</h2>
  <p style="font-size:0.85em;color:#888;margin-bottom:1rem;">
    Live via WebSocket + pg_eventserv (channel: webui_events)
  </p>
  <ul id="eventlog-list" class="list event-log">
    {{range .}}
    <li class="list-item event-item">
      <span class="type">{{.Type}}</span>
      <span class="id">{{.ID}}</span>
      <pre class="payload">{{.Payload}}</pre>
    </li>
    {{end}}
  </ul>
</div>

<script>
(function() {
  var ws = new WebSocket('ws://' + window.location.hostname + ':7700/listen/webui_events');
  ws.onopen = function() { console.log('WebSocket connected to pg_eventserv'); };
  ws.onmessage = function(event) {
    var data = JSON.parse(event.data);
    var list = document.getElementById('eventlog-list');
    var li = document.createElement('li');
    li.className = 'list-item event-item';
    li.innerHTML = '<span class="timestamp">' + (data.time || '') + '</span>' +
                   '<span class="type">' + data.type + '</span>' +
                   '<span class="id">' + data.id + '</span>' +
                   '<pre class="payload">' + (data.payload ? JSON.stringify(data.payload, null, 2) : '') + '</pre>';
    list.prepend(li);
  };
  ws.onclose = function() { console.log('WebSocket disconnected'); };
  ws.onerror = function(err) { console.log('WebSocket error:', err); };
})();
</script>
{{end}}
